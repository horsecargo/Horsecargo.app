[build]
  publish = "www"
  command = "node scripts/stamp-web-release.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["imapflow", "mailparser", "nodemailer", "web-push"]
