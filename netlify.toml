[build]
  publish = "www"
  command = "node scripts/stamp-web-release.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"
    # No inline scripts or handlers; inline styles remain for generated markup.
    # Supabase is the only external origin (REST, Auth, Storage photos, Realtime).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://kaigvimoufrdfhjsaska.supabase.co; connect-src 'self' https://kaigvimoufrdfhjsaska.supabase.co wss://kaigvimoufrdfhjsaska.supabase.co; media-src 'self' blob:; worker-src 'self' blob:; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["imapflow", "mailparser", "nodemailer", "web-push"]
