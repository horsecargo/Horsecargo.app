name: Documents and packing checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: hc
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify JavaScript syntax
        run: find www/js -name '*.js' -exec sh -c 'node --input-type=module --check < "$1"' _ {} \;
      - run: npm run test:setup
      - name: Start isolated adapter
        run: |
          node test/server.mjs > work-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat work-server.log
          exit 1
      - run: npm run test:v5
      - name: Existing storage and shipment regressions
        run: |
          npm run test:setup
          node test/v4_test.mjs
          npm run test:setup
          node test/ship_test.mjs | tee shipment-checks.log
          if grep -q '✗' shipment-checks.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documents-packing-qa
          path: work/qa/
