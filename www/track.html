<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#800c1f">
  <title>Track cargo · Horse Cargo</title>
  <link rel="icon" href="icons/favicon-96.png">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .hero { background: radial-gradient(900px 400px at 20% 0%, #a3223a 0%, #800c1f 60%, #4a0612 100%); color: #fff; padding: calc(28px + env(safe-area-inset-top, 0px)) 16px 90px; }
    .hero .in { max-width: 720px; margin: 0 auto; }
    .hero h1 { font-size: 28px; margin: 18px 0 6px; }
    .hero p { color: #f0d3d9; margin: 0; }
    .wrap { max-width: 720px; margin: -60px auto 40px; padding: 0 16px; }
    .big { font-size: 18px; min-height: 52px; }
    .hero .lang-toggle button.on { background: #fff; color: #800c1f; }
    .status-big { font-size: 22px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="hero"><div class="in">
    <div class="row" style="justify-content:space-between">
      <img src="img/logo-white.png" alt="Horse Cargo" style="height:92px;width:auto">
      <div class="lang-toggle" style="background:transparent;border-color:rgba(255,255,255,.3)"><button data-l="en">EN</button><button data-l="sw">SW</button></div>
    </div>
    <h1 data-t="title"></h1><p data-t="sub"></p>
  </div></div>
  <div class="wrap stack">
    <form class="card card-b row" id="f" style="flex-wrap:nowrap">
      <input class="input mono big" id="ref" placeholder="HC-BK-2609-0001" autocapitalize="characters" autocomplete="off" style="flex:1">
      <button class="btn accent big" type="submit" data-t="go"></button>
    </form>
    <div id="out"></div>
    <p class="muted small" style="text-align:center" id="foot"></p>
  </div>
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="js/track-page.js"></script>
</body>
</html>
