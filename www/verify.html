<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#800c1f">
  <meta name="robots" content="noindex">
  <title>Verify document · Horse Cargo</title>
  <link rel="icon" href="icons/favicon-96.png">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .hero { background: radial-gradient(900px 400px at 20% 0%, #a3223a 0%, #800c1f 60%, #4a0612 100%); color: #fff;
            padding: calc(28px + env(safe-area-inset-top, 0px)) 16px 90px; }
    .hero .in { max-width: 640px; margin: 0 auto; }
    .hero h1 { font-size: 26px; margin: 16px 0 6px; }
    .hero p { color: #f0d3d9; margin: 0; }
    .wrap { max-width: 640px; margin: -60px auto 40px; padding: 0 16px; }
    .vbig { font-size: 22px; font-weight: 800; }
    .vrow { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line-2); font-size: 14px; }
    .vrow:last-child { border-bottom: 0; }
    .vrow span { color: var(--ink-2); }
    .vrow b { text-align: right; word-break: break-word; }
    .vstat { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; font-weight: 800; font-size: 16px; }
    .vstat.ok { background: var(--green-soft); color: var(--green); }
    .vstat.wait { background: var(--amber-soft); color: #8a5a00; }
    .vstat.no { background: var(--red-soft); color: var(--red); }
  </style>
</head>
<body>
  <div class="hero"><div class="in">
    <img src="img/logo-white.png" alt="Horse Cargo" style="height:46px">
    <h1>Document verification</h1>
    <p>Check that a Horse Cargo document is genuine and approved.</p>
  </div></div>
  <div class="wrap">
    <div class="card"><div class="card-b" id="out">
      <div class="boot" style="min-height:120px"><div class="spinner"></div></div>
    </div></div>
    <p class="muted small" style="text-align:center;margin-top:14px">
      Questions? Dubai +971 50 608 3531 · Dar es Salaam +255 778 222 251 · Mwanza +255 797 000 254
    </p>
  </div>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="js/verify-page.js"></script>
</body>
</html>
